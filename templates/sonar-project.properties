# Optional: copy into a component folder (next to package.json / pyproject.toml).
# Used by the generic scanner (Node/Python). Maven/Gradle/.NET read their build files instead.
sonar.sources=src
sonar.tests=test,tests
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/migrations/**
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.test.tsx,**/test_*.py
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.*,**/test_*.py,**/main.ts
